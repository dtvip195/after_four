services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.development
    environment:
      HOME: /tmp/after-four-home
      XDG_CACHE_HOME: /tmp/after-four-cache
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: after_four_development
      POSTGRES_TEST_DATABASE: after_four_test
      AUTH_MAXIMUM_ATTEMPTS: ${AUTH_MAXIMUM_ATTEMPTS:-5}
      AUTH_UNLOCK_IN_SECONDS: ${AUTH_UNLOCK_IN_SECONDS:-900}
      BROWSER_ORIGIN: ${BROWSER_ORIGIN:-http://localhost:5173}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:18.7
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - after_four_postgres:/var/lib/postgresql

volumes:
  after_four_postgres:
